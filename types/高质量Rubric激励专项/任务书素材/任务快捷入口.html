<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="Limmer1 的三个 Rubric 校准任务快捷卡片，可切换任务并打开平台页面或提交表单。">
  <title>Limmer1 任务快捷入口</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:100%;max-width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f6f8fc}.wrap{padding:18px;border:1px solid #dde3ef;border-radius:16px;background:#fff}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.head h2{margin:0 0 4px;font-size:20px}.head p{margin:0;color:#667085;font-size:13px}.count{flex:0 0 auto;padding:6px 10px;border-radius:999px;background:#edf2ff;color:#3157d5;font-size:12px;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.tab{padding:10px 8px;border:1px solid #d9dfeb;border-radius:10px;background:#fff;color:#344054;font-weight:700;cursor:pointer}.tab.active{border-color:#3157d5;background:#edf2ff;color:#2446b8}.panel{padding:15px;border:1px solid #dfe5f0;border-radius:12px;background:#f8faff}.panel h3{margin:0 0 7px;font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.pill{padding:4px 8px;border-radius:999px;background:#fff;border:1px solid #dfe5f0;color:#596579;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:700}.primary{background:#3157d5;color:#fff}.secondary{border:1px solid #cfd7e7;background:#fff;color:#344054}.note{margin:12px 0 0;color:#667085;font-size:12px;line-height:1.6}@media(max-width:640px){.tabs{grid-template-columns:1fr}.head{display:block}.count{display:inline-block;margin-top:8px}.actions{display:grid}.action{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div><h2>任务快捷入口</h2><p>先确认任务 ID，再导入同名任务包。</p></div>
      <span class="count">3 个任务 · 64 条 Rubric</span>
    </div>
    <div class="tabs" role="tablist" aria-label="任务列表">
      <button class="tab active" type="button" data-index="0">task_19460</button>
      <button class="tab" type="button" data-index="1">task_19462</button>
      <button class="tab" type="button" data-index="2">task_19463</button>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <script>
    const formUrl='https://bytedance.larkoffice.com/share/base/form/shrcneTsEqlJeEfrZwS2fIHpEnc';
    const tasks=[
      {id:'19460',title:'国内外语音输入法竞品与产品机会调研',count:23,file:'crowd_p778_t19460.v6.case-review.zip',url:'https://ark.volcengine.com/crowdtest/region:cn-beijing/crowdtest/myprojects/778/task/19460'},
      {id:'19462',title:'FDE 模式在中国的落地与商业可行性调研',count:20,file:'crowd_p778_t19462.v6.case-review.zip',url:'https://ark.volcengine.com/crowdtest/region:cn-beijing/crowdtest/myprojects/778/task/19462'},
      {id:'19463',title:'DeepSeek 商业模式与盈利状况研究',count:21,file:'crowd_p778_t19463.v6.case-review.zip',url:'https://ark.volcengine.com/crowdtest/region:cn-beijing/crowdtest/myprojects/778/task/19463'}
    ];
    function render(index){
      const task=tasks[index];
      document.querySelectorAll('.tab').forEach((button,i)=>button.classList.toggle('active',i===index));
      document.getElementById('panel').innerHTML=`<h3>task_${task.id} · ${task.title}</h3><div class="meta"><span class="pill">project_778</span><span class="pill">${task.count} 条 Rubric</span><span class="pill">${task.file}</span></div><div class="actions"><a class="action primary" href="${task.url}" target="_blank" rel="noopener">打开平台任务</a><a class="action secondary" href="${formUrl}" target="_blank" rel="noopener">打开结果提交表单</a></div><p class="note">导出反馈后，每个任务单独提交一次。不要把三个任务的 JSON 混在同一次提交中。</p>`;
    }
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>render(Number(button.dataset.index))));
    render(0);
  </script>
</body>
</html>
